name: Validate
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: [22.20.0, 24.10.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Cache pinned dependencies
        run: deno install --frozen
      - name: Verify committed distribution matches a fresh build
        run: deno task check:dist
      - name: Provision Chromium
        run: deno task setup:browser --with-deps
      - name: Validate types, unit/fixture tests, Chromium and packed consumers
        run: deno task test:all
